<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CodingArena</title>

    <!-- Installable web app -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#191C18">

    <!-- iOS: add to home screen, run full-screen with no Safari chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CodingArena">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #191C18;
            /* No document-level bounce/scroll; the canvas owns all gestures. */
            overscroll-behavior: none;
        }
        body {
            /* Pin to the viewport. `height: 100%` is unreliable in an iOS
               standalone PWA, and a fixed body stops the page itself from
               rubber-banding over a canvas that has nowhere to scroll. */
            position: fixed;
            inset: 0;
            overflow: hidden;
            box-sizing: border-box;
            /* iOS safe areas so the canvas is not clipped by the notch/home bar */
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
            /* Let Compose handle every touch itself. Without this, iOS keeps
               vertical swipes for native scrolling and LazyColumn never moves
               in standalone mode. */
            touch-action: none;
        }
        canvas {
            outline: none;
            touch-action: none;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9aa4b2;
            font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Loading CodingArena…</div>
    <script>
        // iOS (especially a standalone home-screen app) keeps every touchmove
        // for native scrolling unless it is actively cancelled, so the Compose
        // canvas never sees the drag and lists won't scroll. Cancelling it here
        // - before the app loads - hands all gestures to Compose.
        document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    </script>
    <script type="application/javascript" src="codingarena.js"></script>
    <script type="application/javascript" src="sync.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            });
        }
    </script>
</body>
</html>
