<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CodingArena</title>

    <!-- Installable web app -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#191C18">

    <!-- iOS: add to home screen, run full-screen with no Safari chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CodingArena">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #191C18;
            /* iOS safe areas so the canvas is not clipped by the notch/home bar */
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
        }
        canvas { outline: none; }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9aa4b2;
            font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Loading CodingArena…</div>
    <script type="application/javascript" src="codingarena.js"></script>
    <script type="application/javascript" src="sync.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            });
        }
    </script>
</body>
</html>
