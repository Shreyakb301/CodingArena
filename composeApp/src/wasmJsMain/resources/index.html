<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodingArena</title>

    <!-- Installable web app -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#191C18">

    <!-- iOS: add to home screen, run full-screen with no Safari chrome.
         No viewport-fit=cover: iOS then keeps the canvas inside the safe area
         and fills the notch / home-bar zones with the black background, so the
         Compose scene height matches the visible area and nothing is clipped. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="CodingArena">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #191C18;
            /* No document-level bounce; the canvas owns every gesture. Without
               touch-action iOS keeps vertical swipes for native scrolling and
               the Compose lists never move in standalone mode. */
            overscroll-behavior: none;
            touch-action: none;
        }
        canvas {
            display: block;
            outline: none;
            touch-action: none;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9aa4b2;
            font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Loading CodingArena…</div>
    <script>
        // iOS (especially a standalone home-screen app) keeps every touchmove
        // for native scrolling unless it is actively cancelled, so the Compose
        // canvas never sees the drag and lists won't scroll. Cancelling it here
        // - before the app loads - hands all gestures to Compose.
        document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    </script>
    <script type="application/javascript" src="codingarena.js"></script>
    <script type="application/javascript" src="sync.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            });
        }
    </script>
</body>
</html>
