// Applied to :core only when an Android SDK is present. See android-app.gradle
// for why the conditional convention scripts use Groovy, and why the
// androidTarget { } setup itself lives in build.gradle.kts instead of here.
apply plugin: "com.android.library"

android {
    namespace = "com.codingarena.core"
    compileSdk = 35

    defaultConfig {
        minSdk = 26
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
