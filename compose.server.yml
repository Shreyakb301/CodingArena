services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codingarena
      POSTGRES_USER: codingarena
      POSTGRES_PASSWORD: ${ARENA_DATABASE_PASSWORD:?set ARENA_DATABASE_PASSWORD}
    volumes:
      - codingarena-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codingarena"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 8080
      ARENA_DATABASE_URL: jdbc:postgresql://postgres:5432/codingarena
      ARENA_DATABASE_USER: codingarena
      ARENA_DATABASE_PASSWORD: ${ARENA_DATABASE_PASSWORD:?set ARENA_DATABASE_PASSWORD}
      ARENA_JWT_SECRET: ${ARENA_JWT_SECRET:?set ARENA_JWT_SECRET}
      JUDGE0_URL: ${JUDGE0_URL:?set private JUDGE0_URL}
      JUDGE0_TOKEN: ${JUDGE0_TOKEN:?set JUDGE0_TOKEN}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  codingarena-postgres:

