org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
# 2g is enough for JVM/Native, but the Kotlin/Wasm production compiler
# (compileProductionExecutableKotlinWasmJs) needs more headroom for a Compose
# app this size or it dies with OutOfMemoryError. -Xmx is a ceiling, not a
# reservation, so this does not cost JVM-only builds anything.
kotlin.daemon.jvmargs=-Xmx6g

android.useAndroidX=true
android.nonTransitiveRClass=true

# Targets are auto-detected in settings.gradle.kts. Uncomment to force:
# codingarena.android=false
