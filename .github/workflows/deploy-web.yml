name: deploy web

# Builds the Kotlin/Wasm bundle and deploys it + the API functions to
# Cloudflare Pages. Config lives in wrangler.toml (project name, output dir,
# D1 binding).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - token with "Cloudflare Pages: Edit" + "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID
#
# Pages project secrets (set once with `wrangler pages secret put`):
#   JWT_SECRET, APP_URL, and - for Google sign-in - GOOGLE_CLIENT_ID/SECRET.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build browser bundle
        run: >
          ./gradlew :composeApp:wasmJsBrowserDistribution
          -Pcodingarena.apple=false -Pcodingarena.android=false

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=master
