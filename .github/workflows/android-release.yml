name: android release

# Builds a signed Android App Bundle (and APK) for the Play Store.
# Run it by hand from the Actions tab; the .aab/.apk are attached to the run.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   - base64 of keystore/codingarena-upload.jks
#   ANDROID_KEYSTORE_PASSWORD - the keystore's store password
#   ANDROID_KEY_ALIAS         - codingarena-upload
#   ANDROID_KEY_PASSWORD      - the key password

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/codingarena-upload.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/codingarena-upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed bundle + apk
        run: >
          ./gradlew
          :composeApp:bundleRelease :composeApp:assembleRelease
          -Pcodingarena.android=true -Pcodingarena.apple=false -Pcodingarena.web=false

      - name: Clean up secrets
        if: always()
        run: rm -f keystore.properties keystore/codingarena-upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: codingarena-android
          path: |
            composeApp/build/outputs/bundle/release/*.aab
            composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
