name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # native TypeScript for `node --test`
      - run: ./gradlew :core:jvmTest :composeApp:desktopTest :composeApp:compileKotlinDesktop :server:test
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
      - run: ./gradlew :composeApp:compileKotlinWasmJs
      - name: Cloudflare functions tests
        run: node --test "functions-test/*.test.ts"
