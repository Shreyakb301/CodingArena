name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew :core:jvmTest :composeApp:compileKotlinDesktop :server:test
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

